<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>プレゼント抽選テスト</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px 14px 40px;
      font-family:
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        "Meiryo",
        sans-serif;
      background:
        radial-gradient(circle at top, rgba(255, 222, 146, 0.28), transparent 38%),
        linear-gradient(180deg, #2c145e 0%, #6545b8 55%, #a475e6 100%);
      color: #38265f;
    }

    button,
    a {
      -webkit-tap-highlight-color: transparent;
    }

    .container {
      width: 100%;
      max-width: 430px;
      margin: 0 auto;
    }

    .header {
      padding: 28px 18px 22px;
      color: #fff;
      text-align: center;
    }

    .header-badge {
      display: inline-block;
      margin-bottom: 14px;
      padding: 6px 16px;
      border: 1px solid rgba(255,255,255,.55);
      border-radius: 999px;
      background: rgba(255,255,255,.13);
      font-size: 12px;
      font-weight: bold;
    }

    .header h1 {
      margin: 0;
      font-size: 28px;
      line-height: 1.45;
      text-shadow: 0 3px 12px rgba(0,0,0,.35);
    }

    .header p {
      margin: 14px 0 0;
      font-size: 13px;
      line-height: 1.8;
      color: #efe9ff;
    }

    .card {
      padding: 24px 18px;
      background: #fff;
      border: 1px solid rgba(255,255,255,.7);
      border-radius: 24px;
      box-shadow: 0 14px 35px rgba(30, 10, 75, .35);
    }

    .lottery-area {
      text-align: center;
    }

    .lottery-box {
      position: relative;
      width: 180px;
      height: 150px;
      margin: 4px auto 24px;
      border: 5px solid #efd084;
      border-radius: 28px 28px 20px 20px;
      background:
        linear-gradient(135deg, #7f58db, #4b2b9f);
      box-shadow:
        0 12px 22px rgba(72, 37, 145, .3),
        inset 0 0 20px rgba(255,255,255,.15);
    }

    .lottery-box::before {
      content: "";
      position: absolute;
      top: -17px;
      left: 50%;
      width: 90px;
      height: 26px;
      border: 4px solid #efd084;
      border-radius: 14px;
      background: #5531aa;
      transform: translateX(-50%);
    }

    .lottery-box::after {
      content: "運だめし";
      position: absolute;
      top: 54px;
      left: 50%;
      width: 120px;
      padding: 9px 4px;
      border-radius: 12px;
      background: #fff7df;
      color: #6a419e;
      font-size: 18px;
      font-weight: bold;
      transform: translateX(-50%);
    }

    .intro-title {
      margin: 0 0 10px;
      font-size: 21px;
      color: #4e2c96;
    }

    .intro-text {
      margin: 0 0 20px;
      color: #74658d;
      font-size: 13px;
      line-height: 1.8;
    }

    .main-button {
      display: block;
      width: 100%;
      padding: 17px 14px;
      border: 0;
      border-radius: 999px;
      background: linear-gradient(135deg, #805ae4, #bb82f1);
      box-shadow:
        0 7px 0 #5436a1,
        0 12px 22px rgba(77, 44, 150, .28);
      color: #fff;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      transition: transform .15s ease, box-shadow .15s ease;
    }

    .main-button:active {
      transform: translateY(5px);
      box-shadow:
        0 2px 0 #5436a1,
        0 6px 14px rgba(77, 44, 150, .24);
    }

    .main-button:disabled {
      cursor: default;
      opacity: .55;
    }

    .drawing {
      display: none;
      padding: 34px 10px;
      text-align: center;
    }

    .spinner {
      width: 62px;
      height: 62px;
      margin: 0 auto 18px;
      border: 7px solid #eee8fc;
      border-top-color: #805ae4;
      border-radius: 50%;
      animation: spin .85s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .drawing-text {
      color: #5c3e9d;
      font-size: 16px;
      font-weight: bold;
    }

    .result-area {
      display: none;
      text-align: center;
    }

    .result-label {
      display: inline-block;
      margin-bottom: 13px;
      padding: 6px 17px;
      border-radius: 999px;
      background: #f2ebff;
      color: #704bb9;
      font-size: 12px;
      font-weight: bold;
    }

    .result-title {
      margin: 0 0 8px;
      color: #4a278f;
      font-size: 29px;
      line-height: 1.35;
    }

    .result-prize {
      margin: 0 0 18px;
      color: #bd7c23;
      font-size: 21px;
      font-weight: bold;
      line-height: 1.5;
    }

    .result-message {
      margin: 0 0 20px;
      color: #6d6080;
      font-size: 13px;
      line-height: 1.8;
    }

    .code-card {
      margin: 18px 0;
      padding: 17px 12px;
      border: 2px dashed #d3b7f7;
      border-radius: 16px;
      background: #faf7ff;
    }

    .code-label {
      margin-bottom: 7px;
      color: #796894;
      font-size: 12px;
    }

    .code-value {
      color: #4f2b91;
      font-size: 20px;
      font-weight: bold;
      letter-spacing: 1px;
      word-break: break-all;
    }

    .sub-button {
      display: block;
      width: 100%;
      margin-top: 12px;
      padding: 14px 12px;
      border: 1px solid #cfb8ef;
      border-radius: 999px;
      background: #f7f2ff;
      color: #6441a4;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }

    .support-button {
      display: block;
      width: 100%;
      margin-top: 12px;
      padding: 16px 12px;
      border-radius: 999px;
      background: linear-gradient(135deg, #efbb61, #f5d48d);
      box-shadow: 0 6px 0 #b78638;
      color: #513715;
      font-size: 15px;
      font-weight: bold;
      text-decoration: none;
    }

    .notice {
      margin-top: 20px;
      padding: 14px 13px;
      border-radius: 15px;
      background: #fff8ea;
      border: 1px solid #eed8a6;
      color: #795e30;
      font-size: 12px;
      line-height: 1.8;
      text-align: left;
    }

    .already-message {
      margin-bottom: 16px;
      padding: 12px;
      border-radius: 13px;
      background: #f4effc;
      color: #68489c;
      font-size: 13px;
      font-weight: bold;
      line-height: 1.7;
    }

    .test-area {
      margin-top: 22px;
      text-align: center;
    }

    .reset-button {
      padding: 9px 15px;
      border: 1px solid rgba(255,255,255,.5);
      border-radius: 999px;
      background: rgba(255,255,255,.12);
      color: #fff;
      font-size: 11px;
      cursor: pointer;
    }

    .test-note {
      margin-top: 8px;
      color: rgba(255,255,255,.75);
      font-size: 10px;
      line-height: 1.6;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 28px;
      z-index: 999;
      display: none;
      max-width: calc(100% - 40px);
      padding: 12px 18px;
      border-radius: 999px;
      background: rgba(38, 23, 65, .94);
      color: #fff;
      font-size: 13px;
      font-weight: bold;
      text-align: center;
      transform: translateX(-50%);
      box-shadow: 0 8px 24px rgba(0,0,0,.3);
    }
  </style>
</head>

<body>
  <div class="container">

    <div class="header">
      <div class="header-badge">最終動作テスト</div>

      <h1>
        プレゼント<br>
        運だめし抽選会
      </h1>

      <p>
        抽選はこの端末・ブラウザで1回限りです。<br>
        抽選後は、同じ結果をいつでも確認できます。
      </p>
    </div>

    <main class="card">

      <!-- 初回表示 -->
      <section id="lotteryArea" class="lottery-area">
        <div class="lottery-box"></div>

        <h2 class="intro-title">
          くじを引いてみよう
        </h2>

        <p class="intro-text">
          ボタンを押すと抽選が始まります。<br>
          抽選後の結果と参加コードは保存されます。
        </p>

        <button
          id="drawButton"
          class="main-button"
          type="button"
          onclick="startLottery()"
        >
          抽選スタート
        </button>
      </section>

      <!-- 抽選中 -->
      <section id="drawingArea" class="drawing">
        <div class="spinner"></div>

        <div class="drawing-text">
          抽選しています…
        </div>
      </section>

      <!-- 結果 -->
      <section id="resultArea" class="result-area">

        <div
          id="alreadyMessage"
          class="already-message"
          style="display:none;"
        >
          この端末ではすでに抽選済みです。<br>
          前回の抽選結果を表示しています。
        </div>

        <div class="result-label">
          抽選結果
        </div>

        <h2
          id="resultTitle"
          class="result-title"
        ></h2>

        <div
          id="resultPrize"
          class="result-prize"
        ></div>

        <p
          id="resultMessage"
          class="result-message"
        ></p>

        <div class="code-card">
          <div class="code-label">
            参加確認コード
          </div>

          <div
            id="resultCode"
            class="code-value"
          ></div>
        </div>

        <button
          class="sub-button"
          type="button"
          onclick="copyResultCode()"
        >
          参加コードをコピー
        </button>

        <!-- 本番時にサポたんのリンクへ変更 -->
        <a
          id="supportLink"
          class="support-button"
          href="#"
          onclick="handleSupportClick(event)"
        >
          サポたんへ結果を送る
        </a>

        <div class="notice">
          結果画面をスクリーンショットし、参加確認コードとあわせてサポたんへお送りください。<br><br>
          ページを閉じた場合も、同じニュースから再度アクセスすると前回の結果を確認できます。
        </div>
      </section>

    </main>

    <!-- テスト期間中だけ表示 -->
    <div class="test-area">
      <button
        class="reset-button"
        type="button"
        onclick="resetLotteryForTest()"
      >
        テスト用：抽選結果をリセット
      </button>

      <div class="test-note">
        本番公開前に、このリセットボタンは削除してください。
      </div>
    </div>

  </div>

  <div
    id="toast"
    class="toast"
  ></div>

  <script>
    "use strict";

    const STORAGE_KEY = "clear_present_lottery_result_v1";

    /*
      最終テスト用の仮景品です。
      当選確率の合計は100になるよう設定してください。
    */
    const PRIZES = [
      {
        rank: "1等",
        prize: "アロマ",
        probability: 10,
        message: "おめでとうございます！プレゼントが当選しました。"
      },
      {
        rank: "2等",
        prize: "トリートメント",
        probability: 15,
        message: "おめでとうございます！プレゼントが当選しました。"
      },
      {
        rank: "3等",
        prize: "1,000pt",
        probability: 25,
        message: "おめでとうございます！ポイントが当選しました。"
      },
      {
        rank: "4等",
        prize: "500pt",
        probability: 25,
        message: "おめでとうございます！ポイントが当選しました。"
      },
      {
        rank: "参加賞",
        prize: "開運メッセージ",
        probability: 25,
        message: "今回は景品当選ではありませんでしたが、参加賞をお届けします。"
      }
    ];

    let currentResult = null;

    document.addEventListener("DOMContentLoaded", initializePage);

    function initializePage() {
      const savedResult = getSavedResult();

      if (savedResult) {
        currentResult = savedResult;
        showResult(savedResult, true);
        return;
      }

      showLotteryArea();
    }

    function startLottery() {
      const existingResult = getSavedResult();

      if (existingResult) {
        currentResult = existingResult;
        showResult(existingResult, true);
        return;
      }

      const drawButton = document.getElementById("drawButton");
      drawButton.disabled = true;

      hideElement("lotteryArea");
      showElement("drawingArea");

      window.setTimeout(() => {
        try {
          const selectedPrize = drawPrize();

          const result = {
            rank: selectedPrize.rank,
            prize: selectedPrize.prize,
            message: selectedPrize.message,
            code: generateResultCode(selectedPrize.rank),
            drawnAt: new Date().toISOString()
          };

          saveResult(result);

          currentResult = result;

          hideElement("drawingArea");
          showResult(result, false);
        } catch (error) {
          console.error("抽選処理に失敗しました", error);

          hideElement("drawingArea");
          showLotteryArea();

          drawButton.disabled = false;

          showToast(
            "抽選処理に失敗しました。時間をおいて再度お試しください。"
          );
        }
      }, 1800);
    }

    function drawPrize() {
      const randomValue = Math.random() * 100;

      let total = 0;

      for (const prize of PRIZES) {
        total += prize.probability;

        if (randomValue < total) {
          return prize;
        }
      }

      return PRIZES[PRIZES.length - 1];
    }

    function generateResultCode(rank) {
      const normalizedRank = rank
        .replaceAll(" ", "")
        .replaceAll("等", "")
        .replaceAll("参加賞", "P");

      const timePart = Date.now()
        .toString(36)
        .toUpperCase()
        .slice(-5);

      const randomPart = Math.random()
        .toString(36)
        .substring(2, 7)
        .toUpperCase();

      return `CLEAR-${normalizedRank}-${timePart}${randomPart}`;
    }

    function saveResult(result) {
      localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(result)
      );
    }

    function getSavedResult() {
      try {
        const savedValue = localStorage.getItem(STORAGE_KEY);

        if (!savedValue) {
          return null;
        }

        const parsedValue = JSON.parse(savedValue);

        if (
          !parsedValue ||
          !parsedValue.rank ||
          !parsedValue.prize ||
          !parsedValue.code
        ) {
          localStorage.removeItem(STORAGE_KEY);
          return null;
        }

        return parsedValue;
      } catch (error) {
        console.error("保存結果の読み込みに失敗しました", error);
        return null;
      }
    }

    function showLotteryArea() {
      hideElement("drawingArea");
      hideElement("resultArea");
      showElement("lotteryArea");
    }

    function showResult(result, isRevisit) {
      hideElement("lotteryArea");
      hideElement("drawingArea");
      showElement("resultArea");

      document.getElementById("resultTitle").textContent =
        result.rank;

      document.getElementById("resultPrize").textContent =
        result.prize;

      document.getElementById("resultMessage").textContent =
        result.message;

      document.getElementById("resultCode").textContent =
        result.code;

      document.getElementById("alreadyMessage").style.display =
        isRevisit ? "block" : "none";
    }

    async function copyResultCode() {
      if (!currentResult || !currentResult.code) {
        showToast("参加コードを確認できませんでした。");
        return;
      }

      try {
        await navigator.clipboard.writeText(
          currentResult.code
        );

        showToast("参加コードをコピーしました。");
      } catch (error) {
        console.warn("クリップボードAPIが利用できません", error);

        fallbackCopyText(currentResult.code);
      }
    }

    function fallbackCopyText(text) {
      const temporaryInput =
        document.createElement("textarea");

      temporaryInput.value = text;
      temporaryInput.setAttribute("readonly", "");
      temporaryInput.style.position = "fixed";
      temporaryInput.style.opacity = "0";

      document.body.appendChild(temporaryInput);
      temporaryInput.select();

      const success = document.execCommand("copy");

      document.body.removeChild(temporaryInput);

      showToast(
        success
          ? "参加コードをコピーしました。"
          : "コピーできませんでした。コードを長押ししてコピーしてください。"
      );
    }

    function handleSupportClick(event) {
      event.preventDefault();

      /*
        本番では、サポたんへ移動するURLが分かり次第、
        下記のURLを書き換えてください。

        例：
        window.location.href =
          "https://app-clear.com/open?act=xxxxx";
      */

      showToast(
        "現在はテスト用です。本番時にサポたんへのリンクを設定します。"
      );
    }

    function resetLotteryForTest() {
      const confirmed = window.confirm(
        "保存中の抽選結果を削除します。\nテストを最初からやり直しますか？"
      );

      if (!confirmed) {
        return;
      }

      localStorage.removeItem(STORAGE_KEY);

      currentResult = null;

      document.getElementById("drawButton").disabled = false;

      showLotteryArea();

      showToast("抽選結果をリセットしました。");
    }

    function showElement(elementId) {
      document.getElementById(elementId).style.display = "block";
    }

    function hideElement(elementId) {
      document.getElementById(elementId).style.display = "none";
    }

    function showToast(message) {
      const toast = document.getElementById("toast");

      toast.textContent = message;
      toast.style.display = "block";

      window.clearTimeout(showToast.timer);

      showToast.timer = window.setTimeout(() => {
        toast.style.display = "none";
      }, 2400);
    }
  </script>
</body>
</html>
